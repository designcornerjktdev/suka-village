# Local database, the same engine as Hostinger Web/Cloud hosting (MariaDB).
# Host port 3307 (3306 is often taken by a local MySQL/XAMPP).
services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: suka-root
      MARIADB_DATABASE: suka
      MARIADB_USER: suka
      MARIADB_PASSWORD: suka
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "3307:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
volumes:
  mariadb-data:
